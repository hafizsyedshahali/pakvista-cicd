#Abubakar
name: CD - Development

on:
  push:
    branches:
      - develop

jobs:
  deploy:

    runs-on: ubuntu-latest

    environment: development

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_DEV_URL }}

      - name: Confirm deployment
        run: echo "Deployment to development triggered at $(date)"